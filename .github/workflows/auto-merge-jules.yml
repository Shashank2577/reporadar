name: Auto-merge Jules PRs

# Merges any pull request whose diff only touches data/ and content/ (the
# scope check below is the sole gate), once its CI checks pass. Originally
# this also required the author to be google-labs-jules[bot] or a "jules"
# label, but Jules's automationMode: AUTO_CREATE_PR opens PRs under the
# connected account (the human GitHub user who authorized the Jules
# source), not a bot login -- so that check never matched and this
# workflow never auto-merged a single real Jules PR. Scope is what
# AGENTS.md actually promises ("content-only PRs auto-merge after CI"),
# so it's sufficient on its own.
#
# This does NOT use `gh pr merge --auto` (GitHub's native auto-merge
# queue), because that requires the repo-level "Allow auto-merge" setting
# to be on -- it's currently off, and flipping it would affect every PR
# in the repo (including future human ones), not just Jules's. Instead
# this job polls the PR's own checks directly and merges once they all
# pass, which needs no repo-wide setting change. PRs touching paths other
# than data/ and content/ are left for manual review.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the PR only touches content and data
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr view "$PR" --json files --jq '.files[].path')
          echo "$files"
          if echo "$files" | grep -qvE '^(data/|content/)'; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for checks, then merge
        if: steps.scope.outputs.content_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for i in $(seq 1 40); do
            # Fetch all checks
            checks_json=$(gh pr checks "$PR" --json name,state 2>/dev/null || echo "[]")

            # Count how many are pending or in progress (excluding automerge)
            pending=$(echo "$checks_json" | jq '[.[] | select(.name != "automerge" and .name != "Auto-merge Jules PRs") | select(.state == "PENDING" or .state == "IN_PROGRESS")] | length')

            # Count how many failed (excluding automerge)
            failed=$(echo "$checks_json" | jq '[.[] | select(.name != "automerge" and .name != "Auto-merge Jules PRs") | select(.state == "FAILURE" or .state == "ERROR" or .state == "ACTION_REQUIRED")] | length')

            if [ "$failed" -gt 0 ]; then
              echo "::error::A check failed on PR #$PR -- leaving it open for manual review."
              gh pr comment "$PR" --body "One or more checks failed, so this content-only PR was not auto-merged. A maintainer needs to review it."
              exit 1
            elif [ "$pending" -eq 0 ]; then
              echo "All checks passed -- merging."
              gh pr merge "$PR" --squash --delete-branch
              exit 0
            else
              echo "Checks still pending (attempt $i/40), waiting..."
              sleep 20
            fi
          done
          echo "::error::Checks did not finish within 15 minutes -- leaving PR #$PR open for manual review."
          gh pr comment "$PR" --body "Checks didn't finish within the auto-merge workflow's 15-minute window, so this PR was left open. A maintainer needs to review and merge it manually."
          exit 1

      - name: Flag for manual review
        if: steps.scope.outputs.content_only == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "This PR touches files outside data/ and content/, so it will not be auto-merged. A maintainer needs to review it."
