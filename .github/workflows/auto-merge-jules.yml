name: Auto-merge Jules PRs

# Merges any pull request whose diff only touches data/ and content/ (the
# scope check below is the sole gate), once its CI checks pass. Originally
# this also required the author to be google-labs-jules[bot] or a "jules"
# label, but Jules's automationMode: AUTO_CREATE_PR opens PRs under the
# connected account (the human GitHub user who authorized the Jules
# source), not a bot login -- so that check never matched and this
# workflow never auto-merged a single real Jules PR. Scope is what
# AGENTS.md actually promises ("content-only PRs auto-merge after CI"),
# so it's sufficient on its own.
#
# This does NOT use `gh pr merge --auto` (GitHub's native auto-merge
# queue), because that requires the repo-level "Allow auto-merge" setting
# to be on -- it's currently off, and flipping it would affect every PR
# in the repo (including future human ones), not just Jules's. Instead
# this job polls the PR's own checks directly and merges once they all
# pass, which needs no repo-wide setting change. PRs touching paths other
# than data/ and content/ are left for manual review.

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to re-run auto-merge against (for manually retrying after a fix to this workflow, without pushing a no-op commit to the PR branch)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the PR only touches content and data
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          files=$(gh pr view "$PR" --json files --jq '.files[].path')
          echo "$files"
          if echo "$files" | grep -qvE '^(data/|content/)'; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for checks, then merge
        if: steps.scope.outputs.content_only == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Excludes the "automerge" check itself -- this job IS that check,
          # so while it's running gh pr checks always reports it "pending",
          # which would make every other-checks-pass poll loop forever
          # (self-referential deadlock) instead of ever seeing all-pass.
          for i in $(seq 1 40); do
            # Only the "build" check gates the merge. Other statuses (e.g. a
            # hosting provider's deployment check) say nothing about whether
            # the data is valid; one of them (Vercel) failing on every PR once
            # blocked every auto-merge.
            checks=$(gh pr checks "$PR" --json name,bucket --jq '[.[] | select(.name == "build")]')
            echo "$checks"
            if ! echo "$checks" | jq -e 'any(.name == "build")' > /dev/null; then
              echo "\"build\" check hasn't appeared yet (attempt $i/40), waiting..."
              sleep 20
            elif echo "$checks" | jq -e 'all(.bucket == "pass")' > /dev/null; then
              echo "Build passed -- merging."
              # Jules opens these PRs as drafts; GitHub refuses to merge a
              # draft PR, so it must be marked ready first.
              gh pr ready "$PR" || true
              if gh pr merge "$PR" --squash --delete-branch; then
                exit 0
              fi
              # Typically a merge conflict: the branch rewrites data files the
              # pipeline has since changed. replay-jules-prs.yml applies such
              # PRs' summaries onto main, so leave this one for it.
              echo "::warning::PR #$PR could not be merged directly; replay-jules-prs.yml will apply it."
              exit 0
            elif echo "$checks" | jq -e 'any(.bucket == "fail")' > /dev/null; then
              echo "::error::The build failed on PR #$PR -- leaving it open for manual review."
              gh pr comment "$PR" --body "The build failed, so this content-only PR was not auto-merged. A maintainer needs to review it."
              exit 1
            else
              echo "Build still pending (attempt $i/40), waiting..."
              sleep 20
            fi
          done
          echo "::error::Checks did not finish within 15 minutes -- leaving PR #$PR open for manual review."
          gh pr comment "$PR" --body "Checks didn't finish within the auto-merge workflow's 15-minute window, so this PR was left open. A maintainer needs to review and merge it manually."
          exit 1

      # Manual/sweeper recovery path (workflow_dispatch with pr_number) --
      # deliberately does NOT poll gh pr checks for "build" the way the
      # normal path above does. Confirmed live on PR #93: a build triggered
      # this way DOES run and DOES get linked to the PR via the check-runs
      # API's own pull_requests field, but never surfaces in the PR's
      # statusCheckRollup that gh pr checks reads (a GitHub-side gap between
      # the two, not something under this workflow's control) -- so that
      # poll would just spin for the full 15 minutes and never see it.
      # Building it directly here and merging on that result sidesteps the
      # gap entirely instead of depending on GitHub to surface it.
      - name: Set up Node (manual/sweeper recovery only)
        if: steps.scope.outputs.content_only == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build directly and merge (manual/sweeper recovery)
        if: steps.scope.outputs.content_only == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.inputs.pr_number }}
        run: |
          branch=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          git fetch origin "$branch"
          git checkout "$branch"

          echo "Running the build directly against $branch (bypassing PR check-rollup)."
          if npm ci && npm run build; then
            echo "Build passed -- merging."
            gh pr ready "$PR" || true
            gh pr merge "$PR" --squash --delete-branch ||
              echo "::warning::PR #$PR could not be merged directly (likely a conflict); replay-jules-prs.yml will apply it."
          else
            echo "::error::Build failed on PR #$PR -- leaving it open for manual review."
            gh pr comment "$PR" --body "The build failed when this PR's auto-merge was manually retried, so it was not merged. A maintainer needs to review it."
            exit 1
          fi

      - name: Flag for manual review
        if: steps.scope.outputs.content_only == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "This PR touches files outside data/ and content/, so it will not be auto-merged. A maintainer needs to review it."
