name: Auto-merge Jules PRs

# Enables auto-merge on any pull request whose diff only touches data/ and
# content/ (the scope check below is the sole gate). Originally this also
# required the author to be google-labs-jules[bot] or a "jules" label, but
# Jules's automationMode: AUTO_CREATE_PR opens PRs under the connected
# account (the human GitHub user who authorized the Jules source), not a
# bot login -- so that check never matched and this workflow never
# auto-merged a single real Jules PR. Scope is what AGENTS.md actually
# promises ("content-only PRs auto-merge after CI"), so it's sufficient on
# its own. The PR still has to pass the CI build before GitHub merges it,
# and branch protection rules apply. PRs touching other paths are left for
# manual review.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the PR only touches content and data
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr view "$PR" --json files --jq '.files[].path')
          echo "$files"
          if echo "$files" | grep -qvE '^(data/|content/)'; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.scope.outputs.content_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash

      - name: Flag for manual review
        if: steps.scope.outputs.content_only == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "This PR touches files outside data/ and content/, so it will not be auto-merged. A maintainer needs to review it."
