name: Deploy to Cloudflare Pages

# The site is a static export (see next.config.ts), built here and uploaded
# to Cloudflare Pages with `wrangler pages deploy`. Building on a GitHub
# runner (not on the host) keeps the build off any host's memory/minute caps.
#
# Data commits made by the pipeline workflows use the default GITHUB_TOKEN and
# therefore do not trigger `push` workflows, so a schedule picks them up.
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "content/**"
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Canonical URLs, the sitemap and robots.txt are all derived from this at
      # build time. Without it they would silently point at the fallback domain.
      - name: Require production site URL
        run: |
          if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "::error::Set the NEXT_PUBLIC_SITE_URL repository variable (e.g. https://reporadar.spreix.com)."
            exit 1
          fi
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          NEXT_PUBLIC_BUTTONDOWN_USERNAME: ${{ vars.NEXT_PUBLIC_BUTTONDOWN_USERNAME }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=reporadar --branch=main
