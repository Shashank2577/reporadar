name: Repo requests

# Fires the moment a repo request is opened. The site's request form asks for
# the `repo-request` label, but GitHub silently drops labels on new issues
# unless the author has push access, so ordinary visitors' issues arrive
# unlabeled: this therefore triggers on `opened` (title prefix) as well as
# `labeled`, and the script applies the label itself. Searches GitHub for the
# best-matching repository, adds it to tracking, comments the result, and
# closes the issue.
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  process:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'repo-request' ||
      (github.event.action == 'opened' && startsWith(github.event.issue.title, 'Repo request:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Find and track a match
        env:
          GITHUB_TOKEN: ${{ secrets.REPORADAR_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/process-repo-requests.mjs

      - name: Commit and push
        run: |
          git config user.name "reporadar-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: repo request $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
